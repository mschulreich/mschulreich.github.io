bio: |
  I am an astrophysicist studying the dynamics of the interstellar and intergalactic medium — above all the interfaces where hot, tenuous gas meets cooler, denser material. I follow this question across scales: from the mid-infrared bubbles around young massive stars, through superbubbles such as the Local Bubble that surrounds the Sun, to Galaxy-scale outflows like the *eROSITA* and *Fermi* bubbles, and to high-velocity clouds and other obstacles moving through hot gas. My approach combines analytic theory with high-resolution 3D (magneto)hydrodynamic simulations and synthetic observables that can be tested directly against data.

  Close to home, the same physics lets us read the history of our cosmic neighborhood in atoms: radionuclides found on Earth and the Moon record the supernovae that created the Local Bubble — an emerging field known as supernova archaeology. At the Department of Astrophysics of the University of Vienna, I lead the FWF-funded project [ORION](https://doi.org/10.55776/PAT1519826) (*Origins of Radionuclides In Our Neighborhood*), which combines 3D magnetohydrodynamic simulations of the Local Bubble and its neighboring superbubbles with *Gaia*-based reconstructions of nearby stellar groups to trace these supernovae.

