{{/* Navbar: switch from transparent to solid once the page is scrolled */}}
<script>
  (function () {
    var h = document.querySelector('.page-header');
    if (!h || !document.getElementById('splash')) return;
    var update = function () { h.classList.toggle('is-scrolled', window.scrollY > 20); };
    update();
    window.addEventListener('scroll', update, { passive: true });
  })();
</script>
