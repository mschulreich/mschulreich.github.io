{{/* Site-specific style tweaks (kept minimal; everything else comes from HugoBlox) */}}
{{/* Menu font: Source Sans 3 — the sans-serif companion of the body font Source Serif 4 */}}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
  /* Content width shared by navbar, hero text and the blocks below
     (HugoBlox blocks use max-w-7xl = 80rem with 1rem side padding) */
  :root { --site-max: 80rem; --site-pad: 1rem; }

  /* ── Navbar ───────────────────────────────────────────────── */
  #site-header.header { padding-inline: var(--site-pad); transition: background-color .3s ease, box-shadow .3s ease, color .3s ease; }
  #site-header .navbar { max-width: var(--site-max); margin-inline: auto; padding-inline: 0; }
  .navbar-brand svg { height: 2.1rem; width: auto; }
  /* frosted glass: semi-transparent header colour + blur of what scrolls underneath.
     The effect sits on a ::before layer instead of the header itself: an element with backdrop-filter
     becomes the "backdrop root" for its descendants, so the dropdowns inside it could only blur the
     header, not the page below. */
  #site-header.header { position: relative; isolation: isolate; background-color: transparent; }
  #site-header.header::before {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background-color: color-mix(in srgb, var(--hb-color-header-bg) 72%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    backdrop-filter: saturate(180%) blur(16px);
    transition: opacity .3s ease;
  }

  /* Pages with a splash hero: header floats over the image, transparent
     with white logo/text until the page is scrolled (see body-end hook) */
  body:has(#splash) .page-header { position: fixed; inset-inline: 0; }
  /* anchor jumps: HugoBlox already sets html { scroll-padding-top: <navbar height> },
     so the section heading sits one section padding (48 px) below the navbar, the same
     white space as above the heading of the Talks/Publications pages. */
  body:has(#splash) section[id] { scroll-margin-top: 0; }      /* heading lands 48 px below the menu bar, as on the subpages */
  body:has(#splash) section#about { scroll-margin-top: -2rem; } /* About has 80 px top padding */
  body:has(#splash) .page-header:not(.is-scrolled) #site-header:not(:has(#nav-toggle:checked))::before { opacity: 0; }
  body:has(#splash) .page-header:not(.is-scrolled) #site-header:not(:has(#nav-toggle:checked)) {
    background-color: transparent;
    box-shadow: none;
    --hb-color-header-fg: #fff;
    color: #fff;
  }

  /* menu font: sans-serif */
  #site-header .nav-link, #site-header .nav-dropdown-link {
    font-family: "Source Sans 3", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-weight: 500; font-size: 1.05rem; letter-spacing: .01em;
  }
  /* menu text has the same colour as the logo (header foreground: near-black / near-white,
     white over the splash); hover = the accent violet of the current mode, like title links */
  #site-header .nav-link, #site-header .nav-dropdown-link, #site-header div:has(> .theme-toggle) {
    color: #24292f !important; transition: color .15s; }
  html.dark #site-header .nav-link, html.dark #site-header .nav-dropdown-link, html.dark #site-header div:has(> .theme-toggle) { color: #f0f6fc !important; }
  /* hover colours only on devices with a real pointer: on touch screens :hover sticks after a tap */
  @media (hover: hover) {
  #site-header .nav-link:hover, #site-header .nav-dropdown-link:hover, #site-header div:has(> .theme-toggle):hover { color: var(--link) !important; }
  html.dark #site-header .nav-link:hover, html.dark #site-header .nav-dropdown-link:hover, html.dark #site-header div:has(> .theme-toggle):hover { color: var(--link) !important; }
  }
  /* transparent header over the splash: white, like the logo there */
  body:has(#splash) .page-header:not(.is-scrolled) #site-header:not(:has(#nav-toggle:checked)) .nav-link,
  body:has(#splash) .page-header:not(.is-scrolled) #site-header:not(:has(#nav-toggle:checked)) div:has(> .theme-toggle) { color: #fff !important; }
  /* over the dark photo: the light (dark-mode) violet stays readable in both modes */
  @media (hover: hover) {
  body:has(#splash) .page-header:not(.is-scrolled) #site-header:not(:has(#nav-toggle:checked)) .nav-link:hover,
  body:has(#splash) .page-header:not(.is-scrolled) #site-header:not(:has(#nav-toggle:checked)) div:has(> .theme-toggle):hover { color: var(--color-primary-400) !important; }
  }

  /* dark-mode toggle: same colours as the menu links, flush with the right content edge */
  /* desktop only (no burger icon next to it): pull the moon/sun flush with the right content edge */
  @media (min-width: 1024px) {
    #site-header div:has(> .theme-toggle) { padding-right: 0; }
    /* the glyphs sit inside their 24px box: pull them to the content edge */
    #site-header .theme-toggle #moon { margin-right: -4.5px; }
    #site-header .theme-toggle #sun { margin-right: -3px; }
  }

  /* no blue row highlight in the dark-mode dropdown (HugoBlox default); hover = text colour only */
  .nav-dropdown-item:hover, html.dark .nav-dropdown-item:hover { background-color: transparent !important; }

  /* even spacing between all top-level menu items (dropdown parents included) */
  @media (min-width: 1024px) {
    #nav-menu { gap: 2rem; }
    #nav-menu > li { margin: 0 !important; }
    #nav-menu > li > .nav-link { padding-inline: 0; }
  }

  /* dropdown: same frosted glass as the scrolled navbar */
  .nav-dropdown-list {
    background-color: color-mix(in srgb, var(--hb-color-header-bg) 72%, transparent) !important; /* same as the navbar */
    -webkit-backdrop-filter: saturate(180%) blur(16px); backdrop-filter: saturate(180%) blur(16px);
    border: 1px solid rgba(127,127,127,.18);
  }
  /* burger menu (< lg): the submenus sit inside the already frosted panel, so a second
     frosted box looks opaque; use a faint tint instead */
  @media (max-width: 1023.98px) {
    #site-header .nav-dropdown-list {
      background-color: rgba(127,127,127,.07) !important;
      -webkit-backdrop-filter: none; backdrop-filter: none;
      border-color: transparent; box-shadow: none !important;
    }
  }

  /* ── Splash block ─────────────────────────────────────────── */
  #splash { color: #fff; }
  #splash .splash-inner {
    min-height: 100svh; display: flex; flex-direction: column; justify-content: flex-end;
    max-width: var(--site-max); margin-inline: auto; padding: 0 var(--site-pad) 4.5rem;
    box-sizing: border-box; max-width: calc(var(--site-max) + 2 * var(--site-pad));
  }
  /* dark gradients: bottom for the text, top for the transparent navbar */
  #splash::after {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 18%),
      linear-gradient(to top, rgba(0,0,0,.8) 0%, rgba(0,0,0,.35) 30%, rgba(0,0,0,0) 55%);
  }
  #splash .splash-title {
    margin: 0; font-family: var(--hb-font-heading, inherit); font-weight: 400;
    font-size: clamp(2.4rem, 6vw, 4.5rem); line-height: 1.05; letter-spacing: -0.01em;
    color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.5);
  }
  #splash .splash-surname { font-weight: 700; }
  #splash .splash-subtitle {
    margin: .6rem 0 0; font-size: clamp(1.1rem, 2vw, 1.5rem);
    color: rgba(255,255,255,.85); text-shadow: 0 1px 8px rgba(0,0,0,.5);
  }
  #splash .splash-links { list-style: none; padding: 0; margin: 2rem 0 0; display: flex; gap: .9rem; flex-wrap: wrap; }
  #splash .splash-links a {
    width: 3rem; height: 3rem; display: flex; align-items: center; justify-content: center;
    border-radius: 9999px; color: #fff;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: background-color .2s, color .2s, transform .2s;
  }
  #splash .splash-links a:hover { background: #fff; color: #111; transform: translateY(-2px); }
  #splash .splash-icon { width: 1.5rem; height: 1.5rem; }
  /* desktop: text block at the right edge of the content area, away from the person */
  @media (min-width: 1024px) {
    #splash .splash-text { margin-left: auto; width: auto; }
    #splash .splash-title { white-space: nowrap; }
  }

  /* ── About block ──────────────────────────────────────────── */
  #about { padding-block: 5rem 3rem; }
  #about .about-wrap { max-width: var(--site-max); margin-inline: auto; padding-inline: var(--site-pad); box-sizing: content-box; }
  #about .about-heading {
    font-size: clamp(1.9rem, 3vw, 2.25rem); line-height: 1.2; font-weight: 700; margin: 0 0 2.5rem;
  }
  /* sub-sections of About share one heading style: Research Interests, Positions, Education */
  #about .about-subheading, #about .about-cv h2 {
    font-size: 1.5rem; line-height: 1.3; font-weight: 700; margin: 0 0 1.25rem; text-align: left;
  }
  #about .about-cv h2 { margin-bottom: 1.75rem; }
  #about .about-intro { display: grid; gap: 2.5rem; align-items: center; }
  #about .about-bio { font-size: 1.125rem; line-height: 1.8; }
  #about .about-bio p { margin: 0 0 1.1em; }
  #about .about-bio p:last-child { margin-bottom: 0; }
  #about .about-bio a { color: var(--link); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
  .dark #about .about-bio a { color: var(--link); }
  #about .about-photo { margin: 0; }
  #about .about-photo img { width: 100%; height: auto; display: block; border-radius: 1rem;
    box-shadow: 0 20px 40px -18px rgba(0,0,0,.45); }
  @media (min-width: 1024px) {
    #about .about-intro { grid-template-columns: 7fr 5fr; gap: 4rem; }
    #about .about-photo img { max-height: 34rem; object-fit: cover; }
  }
  #about .about-interests { margin-top: 3.5rem; }
  #about .about-tools { margin-top: 2.5rem; }
  #about .about-tools-list { margin: 0; display: grid; gap: 1rem 2.5rem; grid-template-columns: 1fr; }
  @media (min-width: 768px) { #about .about-tools-list { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1024px) { #about .about-tools-list { grid-template-columns: repeat(3, 1fr); } }
  #about .about-tools-list dt { font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; opacity: .65; }
  #about .about-tools-list dd { margin: .2rem 0 0; }
  #about .about-chips { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: .6rem; }
  #about .about-chips li {
    padding: .45rem 1rem; border-radius: 9999px; font-size: .95rem;
    background: color-mix(in srgb, var(--link) 7%, transparent); color: var(--link);
    border: 1px solid color-mix(in srgb, var(--link) 18%, transparent);
  }
  #about .about-cv { margin-top: 4.5rem; }

  /* Positions | Education side by side on desktop (embedded resume-experience block) */
  @media (min-width: 1024px) {
    #about .about-cv .max-w-4xl { max-width: calc(var(--site-max) + 2 * var(--site-pad)); padding-inline: var(--site-pad); }
    #about .about-cv .max-w-4xl > .flex.flex-col { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: start; }
  }

  /* ── Selected publications (pubcards block) ─────────────────── */
  #publications { padding-block: 3rem 5rem; }
  #publications .pubcards-wrap { max-width: var(--site-max); margin-inline: auto; padding-inline: var(--site-pad); box-sizing: content-box; }
  #publications .pubcards-heading { font-size: clamp(1.9rem, 3vw, 2.25rem); line-height: 1.2; font-weight: 700; margin: 0 0 2.5rem; }
  .pubcards-grid { display: grid; gap: 2rem; grid-template-columns: 1fr; }
  @media (min-width: 768px) { .pubcards-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1024px) { .pubcards-grid { grid-template-columns: repeat(3, 1fr); } }
  .pubcard { display: flex; flex-direction: column; border-radius: 1rem; overflow: hidden;
    border: 1px solid rgba(0,0,0,.08); background: var(--hb-color-background, #fff);
    box-shadow: 0 10px 30px -18px rgba(0,0,0,.35); transition: transform .2s, box-shadow .2s; }
  .pubcard:hover { transform: translateY(-3px); box-shadow: 0 18px 40px -18px rgba(0,0,0,.45); }
  .dark .pubcard { border-color: rgba(255,255,255,.1); background: rgba(255,255,255,.03); }
  .pubcard-media { display: block; aspect-ratio: 16 / 10; overflow: hidden; }
  .pubcard-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pubcard-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    padding: 1rem; text-align: center; font-style: italic; color: rgba(255,255,255,.85);
    background: radial-gradient(120% 120% at 80% 0%, #3b5b8c 0%, #1b2a45 55%, #0e1626 100%); }
  .pubcard-body { padding: 1.25rem 1.4rem 1.4rem; display: flex; flex-direction: column; gap: .55rem; flex: 1; }
  .pubcard-venue { margin: 0; font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; opacity: .65; }
  .pubcard-title { margin: 0; font-size: 1.1rem; line-height: 1.35; font-weight: 700; }
  .pubcard-title a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .pubcard-authors { margin: 0; font-size: .9rem; opacity: .8; }
  .pubcard-summary { margin: .2rem 0 0; font-size: .9rem; line-height: 1.55; opacity: .85; }
  .pubcard-links { margin: auto 0 0; padding-top: .6rem; display: flex; flex-wrap: wrap; gap: .25rem .75rem; font-size: .85rem; font-weight: 600; }
  .pubcard-links a { color: var(--link); }
  .dark .pubcard-links a { color: var(--link); }
  .pubcards-archive { margin: 2.5rem 0 0; text-align: center; }
  .pubcards-archive a { display: inline-block; padding: .7rem 1.4rem; border-radius: 9999px; font-weight: 600;
    border: 1px solid currentColor; }
  /* publications page: tighter spacing between the type sections */
  body:has(#journal) section.hbb-section:not(#publications) { padding-block: 1rem; }
  body:has(#journal) section.hbb-section .mt-16 { margin-top: 1.5rem; }
  /* own name in citation lists */
  .li-cite-author .font-bold { font-weight: 700; }

  /* ══ Generic section layout for the custom blocks (projects, talks, teaching, outreach, contact, project page) ══ */
  .sec-wrap { max-width: var(--site-max); margin-inline: auto; padding-inline: var(--site-pad); box-sizing: content-box; }
  #projects, #talks, #service, #teaching, #outreach, #contact { padding-block: 3rem; }
  #contact { padding-bottom: 5rem; }
  .sec-heading { font-size: clamp(1.9rem, 3vw, 2.25rem); line-height: 1.2; font-weight: 700; margin: 0 0 2rem; }
  .sec-subheading { font-size: 1.5rem; line-height: 1.3; font-weight: 700; margin: 2.5rem 0 1rem; }
  .sec-count { font-size: .9rem; font-weight: 500; opacity: .55; margin-left: .35rem; }
  .sec-intro { margin: -1rem 0 2rem; font-size: 1.05rem; opacity: .85; max-width: 60rem; }
  .sec-intro a, .prj-prose a, .out-desc a { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
  html.dark .sec-intro a, html.dark .prj-prose a { color: var(--link); }
  .sec-archive { margin: 2rem 0 0; }
  .sec-archive a, .proj-cta a { display: inline-block; padding: .6rem 1.3rem; border-radius: 9999px; font-weight: 600; border: 1px solid currentColor; }

  /* ── Projects (homepage teaser) ── */
  .proj-card { display: grid; gap: 2rem; align-items: center; grid-template-columns: 1fr; }
  @media (min-width: 768px) { .proj-card { grid-template-columns: minmax(0, 22rem) 1fr; gap: 3rem; } }
  .proj-media img { width: 100%; height: auto; display: block; border-radius: 1.25rem; box-shadow: 0 24px 50px -24px rgba(40, 10, 90, .65); }
  .proj-meta { margin: 0 0 .4rem; font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; opacity: .65; }
  .proj-title { margin: 0; font-size: 2rem; font-weight: 700; line-height: 1.1; }
  .proj-subtitle { margin: .3rem 0 1rem; font-size: 1.15rem; font-style: italic; opacity: .85; }
  .proj-text { font-size: 1.05rem; line-height: 1.75; max-width: 46rem; }
  .proj-cta { margin: 1.5rem 0 0; }

  /* ── Talks ── */
  .talk-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid rgba(127,127,127,.2); }
  .talk { display: grid; grid-template-columns: 1fr; gap: .25rem; padding: 1rem 0; border-bottom: 1px solid rgba(127,127,127,.2); }
  @media (min-width: 768px) { .talk { grid-template-columns: 11rem 1fr; gap: 1.5rem; } }
  .talk-date { font-size: .9rem; color: color-mix(in srgb, currentColor 70%, transparent); font-variant-numeric: tabular-nums; } /* colour, not opacity: keeps the Upcoming badge at full colour */
  .talk-title { margin: 0 0 .05rem; font-weight: 700; }
  .talk-event { margin: 0; font-weight: 600; line-height: 1.45; }
  .talk-title + .talk-event { font-weight: 400; } /* with a talk title, the event is secondary */
  .talk-title + .talk-title { margin-top: .15rem; }
  .talk-meta { margin: .26rem 0 0; font-size: .9rem; opacity: .85; display: flex; flex-wrap: wrap; gap: .4rem .6rem; align-items: center; }
  .talk-badge { display: inline-block; font-size: .72rem; letter-spacing: .03em; text-transform: uppercase; padding: .1rem .5rem; border-radius: 9999px;
    border: 1px solid rgba(127,127,127,.35); opacity: .9; }
  .talk-badge { align-self: center; line-height: 1.5; } /* in flex rows (publication pages) do not stretch to the row height */
  .talk-badge--invited { border-color: color-mix(in srgb, var(--link) 55%, transparent); color: var(--link); }
  html.dark .talk-badge--invited { color: var(--link); }
  .talk-badge--upcoming { margin-left: .4rem; background: var(--link); border-color: var(--link); color: #fff; }
  /* dark mode: same light violet as the links, dark text for contrast */
  html.dark .talk-badge--upcoming { background: var(--link); border-color: var(--link); color: #0d1117; opacity: 1; }
  .talk-link { font-weight: 600; color: var(--link); }

  /* ── Teaching ── */
  .teach-grid { display: grid; gap: 1.25rem; grid-template-columns: 1fr; }
  @media (min-width: 768px) { .teach-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1024px) { .teach-grid { grid-template-columns: repeat(3, 1fr); } }
  .teach-card { padding: 1.25rem 1.4rem; border-radius: 1rem; border: 1px solid rgba(127,127,127,.2); }
  .teach-kind { margin: 0; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; opacity: .65; }
  .teach-title { margin: .175rem 0 .5rem; font-size: 1.15rem; font-weight: 700; line-height: 1.3; }
  .teach-terms { margin: 0; font-size: .9rem; opacity: .8; line-height: 1.6; }
  .teach-note { margin: .31rem 0 0; font-size: .85rem; font-style: italic; opacity: .7; }
  .teach-more { margin: 1.5rem 0 0; font-size: .95rem; opacity: .85; }

  /* ── Outreach ── */
  .out-intro { display: grid; gap: 2.5rem; align-items: start; }
  @media (min-width: 1024px) { .out-intro { grid-template-columns: 7fr 5fr; gap: 4rem; } }
  .out-text { font-size: 1.1rem; line-height: 1.75; margin-bottom: 1.5rem; }
  .out-list { list-style: none; margin: 0; padding: 0; }
  .out-list li { padding: 1rem 0; border-top: 1px solid rgba(127,127,127,.2); }
  .out-when { margin: 0; font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; opacity: .6; }
  .out-title { margin: .2rem 0; font-size: 1.15rem; font-weight: 700; }
  .out-desc { margin: 0; line-height: 1.65; opacity: .85; }
  .out-photo { margin: 0; }
  .out-photo img { width: 100%; height: auto; border-radius: 1rem; display: block; box-shadow: 0 20px 40px -18px rgba(0,0,0,.45); }
  .out-media-heading { margin: 3.5rem 0 1.5rem; font-size: 1.35rem; font-weight: 700; }
  .out-media { display: grid; gap: 2rem; }
  @media (min-width: 768px) { .out-media { grid-template-columns: repeat(3, 1fr); } }
  .out-card { margin: 0; }
  .out-frame { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; padding: 0; background: #000; border-radius: .75rem; overflow: hidden; box-shadow: 0 16px 32px -18px rgba(0,0,0,.5); }
  .out-frame video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .out-yt { position: relative; cursor: pointer; }
  .out-yt img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .2s; }
  .out-yt:hover img { opacity: .85; }
  .out-play { position: absolute; inset: 0; display: grid; place-items: center; }
  .out-play svg { opacity: .85; transition: opacity .2s; }
  .out-yt:hover .out-play svg { opacity: 1; }
  .out-card figcaption { padding-top: .9rem; }
  .out-card-title { margin: 0; font-weight: 700; line-height: 1.4; }
  .out-card-src { margin: .25rem 0 0; font-size: .9rem; opacity: .7; }
  .out-card-link { display: inline-block; margin-top: .35rem; font-size: .9rem; color: var(--link); }
  .dark .out-card-link { color: var(--link); }

  /* ── Contact ── */
  .contact-grid { display: grid; gap: 2rem; grid-template-columns: 1fr; align-items: start; }
  @media (min-width: 1024px) { .contact-grid { grid-template-columns: 5fr 3fr 4fr; } }
  .contact-grid .sec-intro { margin: 0 0 1rem; }
  .contact-email a { font-size: 1.3rem; font-weight: 600; color: var(--link); }
  html.dark .contact-email a { color: var(--link); }
  .contact-address { font-style: normal; line-height: 1.7; }
  .contact-links { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
  .contact-links a { display: inline-flex; align-items: center; gap: .6rem; font-weight: 500; }
  .contact-links a:hover span { text-decoration: underline; text-underline-offset: 3px; }
  .contact-icon { width: 1.4rem; height: 1.4rem; }

  /* ══ Project page (ORION) ══ */
  .prj-hero { background: radial-gradient(120% 140% at 15% 0%, #3b1a7a 0%, #1c0c44 45%, #0d0624 100%); color: #fff; }
  .prj-hero-inner { max-width: var(--site-max); margin-inline: auto; padding: 4rem var(--site-pad) 4.5rem; box-sizing: content-box;
    display: grid; gap: 2.5rem; align-items: center; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .prj-hero-inner { grid-template-columns: minmax(0, 26rem) 1fr; gap: 4rem; padding-block: 5rem 5.5rem; } }
